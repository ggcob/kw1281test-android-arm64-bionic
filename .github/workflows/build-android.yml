name: Build and Release kw1281test for Android ARM64

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Publish Native AOT
        env:
          LDFLAGS: "-Wl,-z,max-page-size=65536"
        run: |
          dotnet publish kw1281test.csproj -c Release -r linux-arm64 -p:PublishAot=true -p:UnsafeBinary=true -p:StripSymbols=false -p:NativeDebugSymbols=false

      - name: Zip Executable
        run: |
          cd kw1281test/bin/Release/net*.0/linux-arm64/publish/
          zip -r kw1281test-android-arm64.zip kw1281test

      - name: Upload to Release Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: kw1281test/bin/Release/net*.0/linux-arm64/publish/kw1281test-android-arm64.zip
