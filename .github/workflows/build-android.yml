name: Build and Release kw1281test for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Multiarch and Install ARM64 Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/Architectures: amd64/Architectures: amd64 arm64/g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zlib1g-dev:arm64

      - name: Publish Native AOT
        run: |
          dotnet publish kw1281test.csproj -c Release -r linux-arm64 -o ./publish \
            -p:PublishAot=true \
            -p:UnsafeBinary=true \
            -p:StripSymbols=false \
            -p:NativeDebugSymbols=false \
            -p:CppCompilerAndLinker=aarch64-linux-gnu-gcc

      - name: Zip Executable
        run: |
          zip -j publish/kw1281test-android-arm64.zip publish/*

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-arm64
          name: kw1281test Android ARM64
          files: publish/kw1281test-android-arm64.zip
