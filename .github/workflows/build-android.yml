name: Build and Release kw1281test for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ARM64 Toolchain and Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils-aarch64-linux-gnu libc6-dev-arm64-cross zlib1g-dev

      - name: Publish Native AOT
        run: |
          dotnet publish kw1281test.csproj -c Release -r linux-arm64 -o ./publish \
            -p:PublishAot=true \
            -p:UnsafeBinary=true \
            -p:StripSymbols=false \
            -p:NativeDebugSymbols=false \
            -p:CppCompilerAndLinker=clang \
            -p:SysRoot=/usr/aarch64-linux-gnu \
            -p:CustomLinkerArg="-fuse-ld=lld"

      - name: Zip Executable
        run: |
          zip -j publish/kw1281test-android-arm64.zip publish/*

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-arm64
          name: kw1281test Android ARM64
          files: publish/kw1281test-android-arm64.zip
