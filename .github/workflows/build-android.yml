name: Build kw1281test for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Publish Native AOT
        env:
          LDFLAGS: "-Wl,-z,max-page-size=65536"
        run: |
          dotnet publish kw1281test.csproj -c Release -r linux-arm64 -p:PublishAot=true -p:UnsafeBinary=true -p:StripSymbols=false -p:NativeDebugSymbols=false

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: kw1281test-android-arm64
          path: '**/publish/kw1281test'
