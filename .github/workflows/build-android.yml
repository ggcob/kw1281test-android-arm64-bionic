name: Build and Release kw1281test for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Multiarch and Install ARM64 Toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo bash -c 'cat > /etc/apt/sources.list.d/arm64.list <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
          EOF'
          sudo apt-get update
          sudo apt-get install -y clang lld llvm zlib1g-dev:arm64 libc6-dev-arm64-cross

      - name: Publish Native AOT
        run: |
          dotnet publish kw1281test.csproj -c Release -r linux-arm64 -o ./publish \
            -p:PublishAot=true \
            -p:UnsafeBinary=true \
            -p:StripSymbols=false \
            -p:NativeDebugSymbols=false \
            -p:CppCompilerAndLinker=clang \
            -p:SysRoot=/usr/aarch64-linux-gnu

      - name: Zip Executable
        run: |
          zip -j publish/kw1281test-android-arm64.zip publish/*

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-arm64
          name: kw1281test Android ARM64
          files: publish/kw1281test-android-arm64.zip
